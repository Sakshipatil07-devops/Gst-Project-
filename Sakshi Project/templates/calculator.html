<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - QuickBill Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .calculator {
            max-width: 600px;
            margin: 0 auto;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .calc-display {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-family: 'Courier New', monospace;
            min-height: 60px;
            word-wrap: break-word;
        }
        .calc-button {
            width: 100%;
            height: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 10px;
            margin-bottom: 10px;
            border: none;
            transition: all 0.2s;
        }
        .calc-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-number { background: #007bff; color: white; }
        .btn-operator { background: #28a745; color: white; }
        .btn-special { background: #6c757d; color: white; }
        .btn-equals { background: #dc3545; color: white; }
        .gst-calc-section {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        .result-display {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            font-weight: 600;
            color: #155724;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}

    {% block content %}
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">Business Calculator</h1>
                <span class="badge bg-primary">GST Ready</span>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="calculator">
                <h4 class="text-center mb-4">Basic Calculator</h4>

                <form method="post">
                    <div class="calc-display" id="display">
                        {{ expression or "0" }}
                    </div>

                    <input type="hidden" name="expression" id="expression-input" value="{{ expression }}">

                    <div class="row g-2">
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-special" onclick="clearDisplay()">C</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-special" onclick="backspace()">⌫</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-special" onclick="appendToDisplay('(')">(</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-special" onclick="appendToDisplay(')')">)</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('7')">7</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('8')">8</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('9')">9</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-operator" onclick="appendToDisplay('/')">÷</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('4')">4</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('5')">5</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('6')">6</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-operator" onclick="appendToDisplay('*')">×</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('1')">1</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('2')">2</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('3')">3</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-operator" onclick="appendToDisplay('-')">−</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('0')">0</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-number" onclick="appendToDisplay('.')">.</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-equals" name="operation" value="calculate">=</button>
                        </div>
                        <div class="col-3">
                            <button type="button" class="btn calc-button btn-operator" onclick="appendToDisplay('+')">+</button>
                        </div>
                    </div>
                </form>

                {% if result %}
                <div class="result-display">
                    <strong>Result:</strong> {{ result }}
                </div>
                {% endif %}
            </div>
        </div>

        <div class="col-lg-4">
            <div class="gst-calc-section">
                <h5 class="mb-3">GST Calculator</h5>
                <form method="post" class="mb-3">
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="gst_rate" class="form-label">GST Rate (%)</label>
                        <select class="form-select" id="gst_rate" name="gst_rate">
                            <option value="5">5% (Essential goods)</option>
                            <option value="12">12% (Processed foods)</option>
                            <option value="18" selected>18% (General goods)</option>
                            <option value="28">28% (Luxury goods)</option>
                        </select>
                    </div>
                    <button type="submit" name="operation" value="gst_calculate" class="btn btn-primary w-100">Calculate GST</button>
                </form>

                <hr>

                <h6 class="mb-3">Percentage Calculator</h6>
                <form method="post" class="mb-3">
                    <div class="mb-3">
                        <label for="value" class="form-label">Value (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="value" name="value" placeholder="Enter value" required>
                    </div>
                    <div class="mb-3">
                        <label for="percentage" class="form-label">Percentage (%)</label>
                        <input type="number" step="0.01" class="form-control" id="percentage" name="percentage" placeholder="Enter percentage" required>
                    </div>
                    <button type="submit" name="operation" value="percentage" class="btn btn-success w-100">Calculate %</button>
                </form>

                <hr>

                <h6 class="mb-3">Discount Calculator</h6>
                <form method="post">
                    <div class="mb-3">
                        <label for="original_price" class="form-label">Original Price (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="original_price" name="original_price" placeholder="Enter original price" required>
                    </div>
                    <div class="mb-3">
                        <label for="discount_percent" class="form-label">Discount (%)</label>
                        <input type="number" step="0.01" class="form-control" id="discount_percent" name="discount_percent" placeholder="Enter discount %" required>
                    </div>
                    <button type="submit" name="operation" value="discount" class="btn btn-warning w-100">Calculate Discount</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function appendToDisplay(value) {
            const display = document.getElementById('display');
            const input = document.getElementById('expression-input');

            if (display.textContent === '0' && !isNaN(value)) {
                display.textContent = value;
                input.value = value;
            } else {
                display.textContent += value;
                input.value += value;
            }
        }

        function clearDisplay() {
            document.getElementById('display').textContent = '0';
            document.getElementById('expression-input').value = '';
        }

        function backspace() {
            const display = document.getElementById('display');
            const input = document.getElementById('expression-input');

            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
                input.value = input.value.slice(0, -1);
            } else {
                display.textContent = '0';
                input.value = '';
            }
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (!isNaN(key) || ['+', '-', '*', '/', '.', '(', ')'].includes(key)) {
                event.preventDefault();
                appendToDisplay(key);
            } else if (key === 'Enter') {
                event.preventDefault();
                document.querySelector('button[name="operation"][value="calculate"]').click();
            } else if (key === 'Escape') {
                event.preventDefault();
                clearDisplay();
            } else if (key === 'Backspace') {
                event.preventDefault();
                backspace();
            }
        });
    </script>
    {% endblock %}
</body>
</html>
